server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的静态资源（vite 产出的 assets/index-<hash>.js 之类）可以长期缓存：
    # 文件内容一变文件名就变了，不存在"缓存里是旧版本"的问题
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 单页应用的兜底：任意子路径都回 index.html。
    # 没有这一条，用户刷新一个非根路径会拿到 404。
    # index.html 本身不设长缓存，保证发布新版本后用户拿到的是新的资源引用
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 这里刻意没有配 /api 反向代理。
    # 代理规则完全取决于部署拓扑（后端域名、是否同域、路径前缀是否要剥掉），
    # 固定一份进来容易误导。需要同域反代时按下面这段加即可：
    #
    #     location /api/ {
    #         proxy_pass http://backend:8000;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         # SSE 必须关掉缓冲，否则事件会被攒着一起发，界面看起来是"卡住然后一次性刷新"
    #         proxy_buffering off;
    #         proxy_read_timeout 1h;
    #     }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
